<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oliver API | List</title>

<style>
#grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
}

.img-container {
  background: #222;
  padding: 5px;
  border-radius: 8px;
  overflow: hidden;
}

.img-container img {
  width: 100%;
  height: 120px;
  object-fit: cover;
  border-radius: 6px;
  display: block;
}
</style>
</head>

<body>

<div id="grid"></div>

<script>
const jsonURL = 'images.json';

fetch(jsonURL)
  .then(res => res.json())
  .then(images => {
    const grid = document.getElementById('grid');

    images.forEach(path => {
      const container = document.createElement('div');
      container.className = 'img-container';

      const img = document.createElement('img');
      img.src = path;
      img.loading = "lazy";

      container.appendChild(img);
      grid.appendChild(container);
    });
  })
  .catch(err => {
    console.error(err);
    document.body.innerHTML += '<p style="color:red;">Failed to load images.</p>';
  });
</script>

</body>
</html>
